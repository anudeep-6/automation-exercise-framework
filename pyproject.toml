[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-exercise-framework"
version = "0.1.0"
description = "Automation framework for Automation Exercise built with Python, Playwright, and pytest"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Anudeep", email = "anudeep6142@gmail.com"}
]
keywords = ["automation", "testing", "playwright", "pytest", "sdet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-playwright>=0.4.0",
    "pytest-xdist>=3.5.0",
    "pytest-html>=4.1.0",
    "allure-pytest>=2.13.0",
    "requests>=2.31.0",
    "jsonschema>=4.0",
    "python-decouple>=3.8",
    "openpyxl>=3.1.0",
    "faker>=40.15.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "pre-commit>=3.5.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/anudeep-6/automation-exercise-framework"
Repository = "https://github.com/anudeep-6/automation-exercise-framework.git"

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = ["venv", ".venv"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--alluredir=allure-results",
]
markers = [
    "smoke: Quick smoke tests",
    "sanity: Sanity checks",
    "regression: Full regression suite",
    "ui: UI tests only",
    "api: API tests only",
    "hybrid: Combined UI and API tests",
    "browser: Cross-browser specific tests",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s — %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/venv/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]